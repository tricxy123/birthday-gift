<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 450px;
      width: 100%;
      position: relative;
      z-index: 1;
      animation: popIn 0.8s ease-out;
    }

    .emoji {
      font-size: 3.5rem;
      margin-bottom: 15px;
      display: inline-block;
      animation: bounce 2s infinite;
    }

    h1 {
      color: #ff4757;
      font-size: 2.2rem;
      margin-bottom: 15px;
    }

    p {
      color: #57606f;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    button {
      background-color: #ff4757;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
      transition: transform 0.2s, background-color 0.2s;
      width: 100%;
      max-width: 250px;
    }

    button:hover {
      background-color: #ff6b81;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(1px);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-20px); }
      60% { transform: translateY(-10px); }
    }

    @media (max-width: 480px) {
      .card { padding: 30px 20px; }
      h1 { font-size: 1.8rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <div class="card">
    <div class="emoji">🎂</div>
    <h1>Happy Birthday!</h1>
    <p>Wishing you a day filled with laughter, joy, and endless happiness. May all your dreams and wishes come true this year!</p>
    <button onclick="triggerConfetti()">Celebrate! 🎉</button>
  </div>

  <script>
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let pieces = [];
    const numberOfPieces = 100;
    const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6'];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      pieces.forEach((p, index) => {
        p.y += p.gravity;
        p.rotation += p.rotationSpeed;

        ctx.save();
        ctx.fillStyle = p.color;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();

        if (p.y > canvas.height) {
          pieces.splice(index, 1);
        }
      });

      if (pieces.length > 0) {
        requestAnimationFrame(update);
      }
    }

    function triggerConfetti() {
      for (let i = 0; i < numberOfPieces; i++) {
        pieces.push({
          x: canvas.width / 2 + (Math.random() * 100 - 50),
          y: canvas.height / 2 + (Math.random() * 100 - 50),
          size: Math.random() * 8 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          gravity: Math.random() * 3 + 2,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.2
        });
      }
      if (pieces.length === numberOfPieces) {
        update();
      }
    }

    // Trigger on initial page load
    window.onload = triggerConfetti;
  </script>
</body>
</html>
